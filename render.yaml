# Render Blueprint: in Render, choose New > Blueprint and pick this repository.
services:
  - type: web
    name: graphite
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python website/build.py
    startCommand: gunicorn --chdir backend --preload --workers 2 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: graphite-db
          property: connectionString
      - key: BASE_URL
        sync: false   # set to your site's address, e.g. https://graphite.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false

  # The weekly progress email: Sundays at 20:00 UTC (4 pm US Eastern in summer, 3 pm in winter).
  # It shares the web service's SECRET_KEY so the unsubscribe links in its emails work.
  - type: cron
    name: graphite-weekly-email
    runtime: python
    plan: starter   # Render cron jobs run on paid instances
    schedule: "0 20 * * 0"
    buildCommand: pip install -r requirements.txt
    startCommand: python send_weekly.py
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        fromService:
          type: web
          name: graphite
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: graphite-db
          property: connectionString
      - key: BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: graphite-db
    databaseName: graphite
    # Free Render databases are deleted 30 days after creation (plus a 14-day grace period).
    # Change this to a paid plan before real students sign up.
    plan: free
