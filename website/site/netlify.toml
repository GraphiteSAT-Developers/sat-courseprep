# Graphite SAT: Netlify config (use instead of .htaccess when hosting on Netlify)
# Netlify serves HTTPS automatically and redirects http:// to https://.

[[redirects]]
  from = "https://graphiteprep.com/*"
  to = "https://www.graphiteprep.com/:splat"
  status = 301
  force = true

# The logo links to /home. The backend sends signed-in accounts to their dashboard; a static host has no
# accounts, so it's the home page.
[[redirects]]
  from = "/home"
  to = "/"
  status = 302

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
