<section class="cookie-banner" id="cookie-banner" aria-labelledby="cookie-title" hidden>
  <div class="cookie-inner">
    <div>
      <h2 id="cookie-title">Cookies on Graphite SAT</h2>
      <p>Essential cookies keep you signed in and protect forms. With your OK, analytics cookies show us which pages help students. Read the <a href="cookies.html">cookie policy</a>.</p>
    </div>
    <div class="cookie-actions">
      <button class="btn btn-quiet" type="button" id="cookie-choose" aria-expanded="false" aria-controls="cookie-prefs">Choose</button>
      <button class="btn btn-secondary" type="button" id="cookie-reject">Essential only</button>
      <button class="btn btn-primary" type="button" id="cookie-accept">Accept analytics</button>
    </div>
    <div class="cookie-prefs" id="cookie-prefs" hidden>
      <label class="check"><input type="checkbox" checked disabled id="consent-essential"><span>Essential<small>Sign in, security and saving this choice. Always on.</small></span></label>
      <label class="check"><input type="checkbox" id="consent-analytics"><span>Analytics<small>Page views and button clicks, with IP addresses anonymized.</small></span></label>
      <div><button class="btn btn-primary" type="button" id="cookie-save">Save choices</button></div>
    </div>
  </div>
</section>
<p class="visually-hidden" id="cookie-live" role="status" aria-live="polite"></p>
