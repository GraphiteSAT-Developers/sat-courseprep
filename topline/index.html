<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topline Grapher</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap">
<style>
/* Layout: two-pane instrument. Expression ledger on the left, engineering graph paper on the right; graph stacks above the ledger on phones. */
:root{
  --paper:#f4f7fa; --panel:#ffffff; --ink:#18212d; --muted:#5d6979; --rule:#dbe2ea;
  --accent:#2347a6; --accent-soft:#e7edf9; --danger:#b3261e;
  --canvas:#ffffff; --grid-minor:#ebf0f5; --grid-major:#cdd7e2; --axis:#384455;
  --c1:#c8372d; --c2:#2a62c9; --c3:#2b8746; --c4:#7a45b8; --c5:#d4721a; --c6:#202a37;
  --font-ui:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-math:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-data:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e131a; --panel:#141a22; --ink:#e5eaf0; --muted:#94a1b2; --rule:#26303c;
    --accent:#93abff; --accent-soft:#1c2640; --danger:#ff8a80;
    --canvas:#10161e; --grid-minor:#18202a; --grid-major:#29333f; --axis:#a8b5c5;
    --c1:#ff6a5c; --c2:#6c9bff; --c3:#4cc178; --c4:#bb8dff; --c5:#ffa24a; --c6:#e4e8ee;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e131a; --panel:#141a22; --ink:#e5eaf0; --muted:#94a1b2; --rule:#26303c;
  --accent:#93abff; --accent-soft:#1c2640; --danger:#ff8a80;
  --canvas:#10161e; --grid-minor:#18202a; --grid-major:#29333f; --axis:#a8b5c5;
  --c1:#ff6a5c; --c2:#6c9bff; --c3:#4cc178; --c4:#bb8dff; --c5:#ffa24a; --c6:#e4e8ee;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:12px;
  padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.stage{position:relative;min-width:0;min-height:0;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--canvas)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.grabbing{cursor:grabbing}
canvas.on-curve{cursor:pointer}
canvas.ax-x{cursor:ew-resize}
canvas.ax-y{cursor:ns-resize}

.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-math);font-style:italic;font-weight:600;font-size:22px;letter-spacing:.01em}
.brand svg{flex:none}
.bar-actions{display:flex;gap:6px}
.chip{font-family:var(--font-data);font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:transparent}
.chip:hover{border-color:var(--muted)}
.chip[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sec{display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--paper);border-bottom:1px solid var(--rule)}
.sec-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sec-row .grow{flex:1 1 140px;color:var(--muted);font-size:12.5px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px}
.set-row.win{justify-content:flex-start;gap:8px}
.set-row .wl{min-width:52px}
.winin{width:84px;min-width:0;flex:1 1 60px;font-family:var(--font-data);font-size:12.5px;padding:5px 6px;border:1px solid var(--rule);border-radius:5px;background:var(--panel);color:var(--ink);text-align:center}
.set-hint{margin:0;color:var(--muted);font-size:11.5px;line-height:1.5}
.set-row small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--panel);padding:5px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.switch{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:11px;background:var(--rule);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(16px)}
.btn{padding:6px 11px;border-radius:6px;border:1px solid var(--rule);background:var(--panel);font-weight:500}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--panel)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}

.keys{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--rule);scrollbar-width:thin}
.key{flex:none;min-width:38px;height:40px;padding:0 8px;overflow:hidden;font-family:var(--font-math);font-size:17px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);display:inline-flex;align-items:center;justify-content:center}
.key:hover{border-color:var(--muted)}
.key.wide{font-family:var(--font-ui);font-size:13px}
.key .mstatic{font-size:15px;line-height:1.15;pointer-events:none}

.scroll{flex:1;min-height:0;overflow-y:auto}
ol.list{list-style:none;margin:0;padding:0}
li.row{display:grid;grid-template-columns:40px minmax(0,1fr) 34px;border-bottom:1px solid var(--rule);--cc:var(--c1)}
.gut{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:11px;padding-bottom:6px;background:var(--paper);border-right:1px solid var(--rule)}
.row.sel .gut{background:var(--accent-soft)}
.num{font-family:var(--font-data);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:20px;height:20px;border-radius:50%;padding:0;border:2.5px solid var(--cc);background:var(--cc)}
.dot.off{background:transparent}
.dot[hidden]{display:block!important;visibility:hidden}
.dice{width:26px;height:26px;padding:0;border:1px solid var(--rule);border-radius:6px;background:var(--panel);display:grid;place-items:center;color:var(--ink)}
.main{min-width:0;padding:2px 2px 2px 8px}
textarea.note-in{display:block;width:100%;font-family:var(--font-ui);font-style:italic;font-size:15px;line-height:1.45;padding:12px 4px;border:0;background:transparent;color:var(--muted);outline:none;resize:none;overflow:hidden}
.info{padding:0 4px 9px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;line-height:1.45}
.info.err{color:var(--danger);font-family:var(--font-data);font-size:12px}
.info .val{font-size:17px;color:var(--ink);overflow-x:auto;max-width:100%;scrollbar-width:thin;padding-bottom:2px}
.info .stat{font-family:var(--font-data);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.info .smath{font-size:16px;color:var(--ink)}
.info .line{flex-basis:100%}
.add-slider{font-family:var(--font-data);font-size:11.5px;padding:4px 8px;border-radius:5px;border:1px solid var(--accent);color:var(--accent);background:transparent}
.slider{display:grid;grid-template-columns:28px 56px minmax(0,1fr) 56px;gap:8px;align-items:center;padding:0 4px 10px}
.slider input:not([type=range]){width:100%;font-family:var(--font-data);font-size:12px;text-align:center;padding:4px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);color:var(--ink)}
.slider input[type=range]{width:100%;accent-color:var(--cc);margin:0}
.play{width:28px;height:28px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);display:grid;place-items:center;padding:0}
.play svg{fill:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 10px}
.opt{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--rule);background:transparent;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--cc);color:var(--ink);background:var(--paper);box-shadow:inset 0 0 0 1px var(--cc)}
.del{align-self:start;margin-top:9px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);opacity:.4;display:grid;place-items:center;border-radius:6px}
.row:hover .del,.row.sel .del{opacity:.9}
.del:hover{background:var(--paper)}
.tbl{overflow-x:auto;padding:8px 4px 10px}
.tbl table{border-collapse:collapse}
.tbl th,.tbl td{border:1px solid var(--rule);padding:0;vertical-align:middle}
.tbl th{background:var(--paper);font-weight:400}
.tbl th.addc,.tbl td.pad{border:0;background:transparent}
.addcol{width:28px;height:28px;margin-left:4px;border:1px dashed var(--rule);border-radius:6px;background:transparent;color:var(--accent)}

/* ---------- math typesetting ---------- */
.mf{position:relative;display:block;min-height:46px;padding:10px 6px 8px;font-family:var(--font-math);font-size:20px;line-height:1.3;color:var(--ink);overflow-x:auto;overflow-y:hidden;white-space:nowrap;cursor:text;scrollbar-width:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.mf::-webkit-scrollbar{display:none}
.mf-ta{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;margin:0;resize:none;overflow:hidden;font-size:16px;pointer-events:none;white-space:pre;color:transparent;background:transparent}
.mf.mf-empty:not(.mf-focus) .mf-disp::before{content:attr(data-ph);font-family:var(--font-ui);font-size:14px;color:var(--muted)}
.mstatic{font-family:var(--font-math);white-space:nowrap;display:inline-block;line-height:1.3}
.mb{display:inline}
.mb:empty::before{content:"";display:inline-block;width:.5em;height:.78em;background:var(--rule);border-radius:2px;vertical-align:-.06em;margin:0 .04em}
.mroot:empty::before,.str .mb:empty::before{display:none}
.v{font-style:italic}
.n,.fn{font-style:normal}
.fn-end{margin-right:.12em}
.op{padding:0 .15em}
.pu{padding-right:.1em}
.pr{margin-left:.03em}
.lit{font-family:var(--font-ui);font-style:normal}
.str{font-family:var(--font-ui);font-size:.75em;color:var(--muted);padding:0 .3em;vertical-align:.1em}
.str::before{content:"“"}.str::after{content:"”"}
.cmd{font-family:var(--font-data);font-size:.72em;color:var(--accent)}
.cmd .lit{font-family:var(--font-data)}
.txt{font-family:var(--font-ui);font-size:.8em}
.sup{display:inline-block;font-size:.72em;vertical-align:.62em;margin-left:.04em}
.sub{display:inline-block;font-size:.72em;vertical-align:-.34em;margin-left:.02em}
.frac{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;margin:0 .1em;font-size:.92em;text-align:center}
.frac>.fnum{display:block;padding:0 .15em .08em}
.frac>.fden{display:block;padding:.1em .15em 0;border-top:1.2px solid currentColor}
.sqrt{display:inline-flex;align-items:baseline;margin:0 .04em}
.rad{align-self:stretch;width:.62em;flex:none;background:currentColor;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.rbody{display:block;border-top:1.2px solid currentColor;padding:.12em .1em 0 .06em}
.par{display:inline-flex;align-items:baseline}
.par.matp{align-items:center;vertical-align:middle}
.dl{align-self:stretch;flex:none;width:.34em;min-height:1.15em;background:currentColor;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.dl.co,.dl.cc{width:.42em}.dl.vb{width:.3em}
.pbody{display:block;padding:0 .05em}
.mat{display:inline-grid;column-gap:.7em;row-gap:.1em;padding:.1em .25em;text-align:center}
.mat>.mb{display:block}
.big{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .14em 0 .06em}
.big>.hi,.big>.lo{display:block;font-size:.62em;line-height:1.15;min-height:1em}
.bsym{font-size:1.45em;line-height:1}
.big.int{flex-direction:row;align-items:stretch}
.isym{width:.52em;min-height:2.1em;flex:none;background:currentColor;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.lims{display:flex;flex-direction:column;justify-content:space-between;font-size:.62em;margin-left:.08em;line-height:1.1}
.lims>.mb{display:block}
.cur{display:inline-block;width:0;height:1.15em;border-left:1.6px solid var(--accent);margin:0 -.8px;vertical-align:-.24em;animation:mfblink 1.05s step-end infinite}
@keyframes mfblink{50%{opacity:0}}
.msel{background:var(--accent-soft);border-radius:2px}
.cellf{min-height:32px;min-width:76px;padding:6px 8px;font-size:15px;text-align:right}
.thf{min-height:32px;min-width:76px;padding:6px 8px;font-size:16px;text-align:center}
.cellf.mf-focus,.thf.mf-focus{background:var(--accent-soft)}

.dl.bc{-webkit-mask-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2010%20100'%20preserveAspectRatio='none'%3E%3Cpath%20d='M8%200%20H0%20V4%20H4.4%20V96%20H0%20V100%20H8%20Z'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2010%20100'%20preserveAspectRatio='none'%3E%3Cpath%20d='M8%200%20H0%20V4%20H4.4%20V96%20H0%20V100%20H8%20Z'/%3E%3C/svg%3E")}
.dl.co{-webkit-mask-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2010%20100'%20preserveAspectRatio='none'%3E%3Cpath%20d='M10%200%20C5%200%204.5%204%204.5%2010%20V40%20C4.5%2046%203%2049%200%2050%20C3%2051%204.5%2054%204.5%2060%20V90%20C4.5%2096%205%20100%2010%20100%20V97%20C7.5%2097%207%2094%207%2089%20V59%20C7%2053%205.5%2051%203.5%2050%20C5.5%2049%207%2047%207%2041%20V11%20C7%206%207.5%203%2010%203%20Z'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2010%20100'%20preserveAspectRatio='none'%3E%3Cpath%20d='M10%200%20C5%200%204.5%204%204.5%2010%20V40%20C4.5%2046%203%2049%200%2050%20C3%2051%204.5%2054%204.5%2060%20V90%20C4.5%2096%205%20100%2010%20100%20V97%20C7.5%2097%207%2094%207%2089%20V59%20C7%2053%205.5%2051%203.5%2050%20C5.5%2049%207%2047%207%2041%20V11%20C7%206%207.5%203%2010%203%20Z'/%3E%3C/svg%3E")}

  cv.addEventListener('pointermove', e => {
    const [X, Y] = local(e);
    if (!ptrs.has(e.pointerId)) {
      if (e.pointerType === 'mouse') {
        const onCurve = !!hitTest(X, Y), axis = onCurve ? null : axisHit(X, Y);
        cv.classList.toggle('on-curve', onCurve); cv.classList.toggle('ax-x', axis === 'x'); cv.classList.toggle('ax-y', axis === 'y');
      }
      return;
    }
    ptrs.set(e.pointerId, [X, Y]);
    if (!drag) return;
    if (drag.mode === 'pinch' && ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      const dx = Math.abs(a[0] - b[0]), dy = Math.abs(a[1] - b[1]);
      if (drag.dx0 > 50 && drag.dy0 > 50) { view.sx = clampS(drag.sx0 * dx / drag.dx0); view.sy = clampS(drag.sy0 * dy / drag.dy0); }
      else if (drag.dx0 > 50) view.sx = clampS(drag.sx0 * dx / drag.dx0);
      else if (drag.dy0 > 50) view.sy = clampS(drag.sy0 * dy / drag.dy0);
      else { view.sx = clampS(drag.sx0 * d / drag.d0); view.sy = clampS(drag.sy0 * d / drag.d0); }
      view.cx = drag.ux - (mx - W / 2) / view.sx; view.cy = drag.uy + (my - H / 2) / view.sy;
      requestDraw();
    } else if (drag.mode === 'pan') {
      if (Math.hypot(X - drag.sx, Y - drag.sy) > 3) drag.moved = true;
      view.cx = drag.cx - (X - drag.sx) / view.sx; view.cy = drag.cy + (Y - drag.sy) / view.sy;
      requestDraw();
    } else if (drag.mode === 'trace') { trace.t = drag.c.type === 'fx' ? wx(X) : wy(Y); requestDraw(); }
    else if (drag.mode === 'axis') {
      view.cx = drag.cx; view.cy = drag.cy; view.sx = drag.sx; view.sy = drag.sy;
      const f = drag.axis === 'x' ? Math.exp((X - drag.X0) * drag.dir / 200) : Math.exp((drag.Y0 - Y) * drag.dir / 200);
      zoomAxis(drag.axis, f, drag.anchor); requestDraw();
    }
  });
  function endPtr(e) {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (drag && drag.mode === 'pan' && !drag.moved && ptrs.size === 0) { trace = null; pinned = null; requestDraw(); }
    if (drag && drag.mode === 'pinch' && ptrs.size === 1) { const [p] = [...ptrs.values()]; beginPan(p[0], p[1]); drag.moved = true; return; }
    if (ptrs.size === 0) { if (drag && (drag.mode === 'pan' || drag.mode === 'pinch' || drag.mode === 'axis')) save(); drag = null; cv.classList.remove('grabbing', 'ax-x', 'ax-y'); }
  }
  cv.addEventListener('pointerup', endPtr);
  cv.addEventListener('pointercancel', endPtr);
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const [X, Y] = local(e), dy = (e.deltaY || e.deltaX) * (e.deltaMode === 1 ? 30 : 1), f = Math.exp(-dy * 0.0015);
    if (e.shiftKey) { zoomAxis('x', f, X); requestDraw(); save(); }
    else if (e.altKey) { zoomAxis('y', f, Y); requestDraw(); save(); }
    else zoomAt(X, Y, f);
  }, { passive: false });
  $('#zin').addEventListener('click', () => zoomAt(W / 2, H / 2, 1.5));
  $('#zout').addEventListener('click', () => zoomAt(W / 2, H / 2, 1 / 1.5));
  $('#zhome').addEventListener('click', () => { defaultView(); requestDraw(); save(); });

  // ---------- size & theme ----------
  function resize() {
    const r = cv.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height); dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    if (view.pending) { const [a, b] = view.pending; view.pending = null; setRange(a, b); }
    if (!view.ready) { defaultView(); view.ready = true; }
    requestDraw();
  }
  new ResizeObserver(resize).observe($('.stage'));
  const themeChanged = () => { readTheme(); applyTheme(); requestDraw(); };
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeChanged); } catch (e) { /* older browsers */ }
  new MutationObserver(() => { readTheme(); requestDraw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { themeChanged(); fitKeys(); });

  // ---------- boot ----------
  if (!load()) rows = exampleRows();
  ensureTrailing();
  applyTheme();
  readTheme();
  renderKeys();
  fitKeys();
  syncSettings();
  recompute();
  renderList();
  resize();
})();
</script>

</body>
</html>
