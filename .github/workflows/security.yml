# Runs on every push and pull request, and every Monday:
#   tests     the backend's automated tests (including tests/test_security.py)
#   audit     pip-audit: fails if a dependency has a known vulnerability
#   secrets   gitleaks: fails if a key, password or token is committed, in any commit
name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python website/build.py
      - run: cd backend && python -m unittest discover tests

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --strict

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI itself (free, MIT). gitleaks-action@v2 needs a paid license for organization repositories.
      - name: Scan every commit with gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --verbose
